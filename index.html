<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مونجارو | شراء الأقلام</title>
<style>
  :root{
    --bg:#ffffff;
    --card:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --line:#e5e7eb;
    --primary:#7c3aed;
    --primary2:#06b6d4;
    --soft:#f8fafc;
    --chip:#eef2ff;
    --good:#059669;
    --good-bg:#ecfdf5;
    --warn:#b45309;
    --warn-bg:#fffbeb;
    --danger:#991b1b;
    --danger-bg:#fee2e2;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  .wrap{
    max-width:820px;
    margin:24px auto;
    padding:0 14px 24px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px;
    box-shadow:0 14px 34px rgba(15,23,42,.08);
  }
  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:9px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  h1{margin:0;font-size:24px}
  .badge{
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff;
    padding:9px 13px;
    border-radius:999px;
    font-size:13px;
    font-weight:800;
  }
  .input-card{
    background:var(--soft);
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px;
  }
  .input-grid{
    display:grid;
    grid-template-columns:1.5fr .7fr;
    gap:9px;
    align-items:end;
  }
  label{
    display:block;
    font-weight:800;
    margin-bottom:6px;
    font-size:13px;
  }
  input{
    width:100%;
    padding:12px 14px;
    border:1px solid #d1d5db;
    border-radius:15px;
    font-size:15px;
    background:#fff;
    outline:none;
  }
  input:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(124,58,237,.10);
  }
  button{
    border:0;
    border-radius:15px;
    padding:12px 18px;
    min-height:46px;
    cursor:pointer;
    font-size:16px;
    font-weight:800;
    color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
  }
  .mini{
    margin-top:9px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    background:var(--chip);
    color:#4338ca;
    border-radius:999px;
    padding:6px 10px;
    font-size:11px;
    font-weight:800;
  }
  #history{
    margin-top:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .entry{
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px;
    box-shadow:0 8px 24px rgba(15,23,42,.05);
  }
  .entry-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .entry-title{font-size:17px;font-weight:900}
  .entry-sub{font-size:13px;color:var(--muted);margin-top:4px;font-weight:700}
  .picked-note{
    display:inline-block;
    margin-top:6px;
    padding:5px 9px;
    border-radius:999px;
    background:#ecfeff;
    color:#0f766e;
    font-size:11px;
    font-weight:900;
  }
  .delete{
    background:var(--danger-bg);
    color:var(--danger);
    padding:9px 13px;
    min-height:auto;
    font-size:13px;
  }
  .tabby{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    margin-bottom:12px;
  }
  .tabby-box{
    border:1px solid var(--line);
    border-radius:13px;
    padding:10px 12px;
    background:#fafafa;
  }
  .tabby-title{
    font-size:11px;
    color:var(--muted);
    font-weight:800;
    margin-bottom:5px;
  }

  .pay-row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:5px;
  }
  .pay-chip{
    background:#fff;
    border:1px solid var(--line);
    border-radius:999px;
    padding:5px 8px;
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
  }
  .pay-chip.last{
    background:#ecfdf5;
    border-color:#10b981;
    color:#047857;
    box-shadow:0 0 0 2px rgba(16,185,129,.08);
  }
  .tabby-value{
    font-size:15px;
    font-weight:900;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
  }
  .result{
    border:1px solid var(--line);
    background:var(--soft);
    border-radius:16px;
    padding:12px;
    text-align:center;
  }
  .dose{
    display:inline-block;
    padding:6px 10px;
    border-radius:999px;
    background:linear-gradient(135deg,#ede9fe,#cffafe);
    color:#312e81;
    font-size:13px;
    font-weight:900;
    margin-bottom:6px;
  }
  .weeks{
    color:var(--muted);
    font-size:13px;
    margin-bottom:6px;
    font-weight:700;
  }
  .date{
    font-size:15px;
    font-weight:900;
    margin-bottom:6px;
  }
  .date.clickable{
    cursor:pointer;
    display:inline-block;
    padding:6px 10px;
    border-radius:10px;
    background:#ffffff;
    border:1px solid #d8b4fe;
    color:#6d28d9;
    user-select:none;
    transition:.15s ease;
  }
  .date.clickable:hover{
    background:#faf5ff;
    border-color:#a78bfa;
  }
  .date.clickable:active{
    transform:scale(.98);
  }
  .month{
    font-size:13px;
    color:#374151;
    line-height:1.55;
    font-weight:700;
  }
  .status{
    margin-top:7px;
    border-radius:12px;
    padding:7px 8px;
    font-size:11px;
    font-weight:900;
  }
  .status.good{background:var(--good-bg);color:var(--good)}
  .status.warn{background:var(--warn-bg);color:var(--warn)}
  .empty{
    color:#9ca3af;
    text-align:center;
    padding:24px 10px 6px;
    font-weight:700;
  }
  @media(max-width:720px){
    .input-grid{grid-template-columns:1fr}
    .grid{grid-template-columns:1fr}
    .tabby{grid-template-columns:1fr}
    button{width:100%}
    h1{font-size:24px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top">
      <h1>مونجارو</h1>
      <div class="badge">15 mg</div>
    </div>

    <div class="input-card">
      <div class="input-grid">
        <div>
          <label for="purchaseDate">تاريخ الشراء</label>
          <input id="purchaseDate" type="date">
        </div>
        <div>
          <label for="penCount">عدد الأقلام</label>
          <input id="penCount" type="number" min="1" max="20" step="1" value="3">
        </div>
      </div>

      <div class="mini">
        <div class="chip">50 = 12.5 mg</div>
        <div class="chip">45 = 11.25 mg</div>
        <div class="chip">40 = 10 mg</div>
        <div class="chip">تابي: 4 دفعات</div>
      </div>
    </div>

    <div id="history">
      <div class="empty" id="emptyState">اختر تاريخًا</div>
    </div>
  </div>
</div>

<script>
const arabicMonths = [
  "يناير","فبراير","مارس","أبريل","مايو","يونيو",
  "يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"
];

const configs = [
  {units:50, mg:12.5},
  {units:45, mg:11.25},
  {units:40, mg:10}
];

function parseLocalDate(value){
  const [y,m,d] = value.split("-").map(Number);
  return new Date(y, m-1, d, 12, 0, 0);
}

function addDays(date, days){
  const out = new Date(date);
  out.setDate(out.getDate() + days);
  return out;
}

function addMonthsSafe(date, months){
  const out = new Date(date);
  const originalDay = out.getDate();
  out.setDate(1);
  out.setMonth(out.getMonth() + months);
  const lastDay = new Date(out.getFullYear(), out.getMonth()+1, 0).getDate();
  out.setDate(Math.min(originalDay, lastDay));
  return out;
}

function fmt(date){
  return `${date.getDate()}/${date.getMonth()+1}/${date.getFullYear()}`;
}

function inputDateValue(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function monthName(date){
  return `${arabicMonths[date.getMonth()]} ${date.getFullYear()}`;
}

function daysBetween(a,b){
  return Math.round((b-a)/(1000*60*60*24));
}

function buildEntry(value, pens, pickedLabel = ''){
  const start = parseLocalDate(value);
  const totalUnits = pens * 270; // 2.7 ml = 270 units per pen

  // Tabby: 4 payments, first payment on purchase day, final payment 3 months later.
  const finalInstallment = addMonthsSafe(start, 3);

  const entry = document.createElement("div");
  entry.className = "entry";

  const head = document.createElement("div");
  head.className = "entry-head";

  const headText = document.createElement("div");
  headText.innerHTML = `
    <div class="entry-title">${fmt(start)}</div>
    <div class="entry-sub">${pens} قلم · ${totalUnits} يونيت</div>
    ${pickedLabel ? `<div class="picked-note">مختار من نتيجة ${pickedLabel}</div>` : ``}
  `;

  const del = document.createElement("button");
  del.className = "delete";
  del.textContent = "حذف";
  del.addEventListener("click", () => {
    entry.remove();
    updateEmpty();
  });

  head.appendChild(headText);
  head.appendChild(del);

  const paymentDates = [
    start,
    addMonthsSafe(start, 1),
    addMonthsSafe(start, 2),
    addMonthsSafe(start, 3)
  ];

  const tabby = document.createElement("div");
  tabby.className = "tabby";
  tabby.innerHTML = `
    <div class="tabby-box">
      <div class="tabby-title">تابي · 4 دفعات</div>
      <div class="pay-row">
        <span class="pay-chip">${fmt(paymentDates[0])}</span>
        <span class="pay-chip">${fmt(paymentDates[1])}</span>
        <span class="pay-chip">${fmt(paymentDates[2])}</span>
        <span class="pay-chip last">الأخيرة ${fmt(paymentDates[3])}</span>
      </div>
    </div>
  `;

  const grid = document.createElement("div");
  grid.className = "grid";

  configs.forEach(c => {
    const weeks = totalUnits / c.units;
    const end = addDays(start, Math.round(weeks * 7));
    const diff = daysBetween(finalInstallment, end);

    let statusText, statusClass;
    if(diff >= 0){
      statusText = `تابي ينتهي قبل الأقلام بـ ${diff} يوم`;
      statusClass = "good";
    } else {
      statusText = `الأقلام تنتهي قبل تابي بـ ${Math.abs(diff)} يوم`;
      statusClass = "warn";
    }

    const box = document.createElement("div");
    box.className = "result";
    box.innerHTML = `
      <div class="dose">${c.units} يونيت = ${c.mg} mg</div>
      <div class="weeks">${weeks.toFixed(2).replace(/\.00$/,"")} أسبوع</div>
      <div class="date clickable" title="اضغط على التاريخ لإضافته كنتيجة جديدة">${fmt(end)}</div>
      <div class="status ${statusClass}">${statusText}</div>
    `;

    const resultDate = box.querySelector(".date.clickable");
    resultDate.addEventListener("click", () => {
      const penInput = document.getElementById("penCount");
      const nextPens = Math.max(1, parseInt(penInput.value || String(pens), 10));

      const history = document.getElementById("history");
      const nextEntry = buildEntry(
        inputDateValue(end),
        nextPens,
        `${c.units} يونيت = ${c.mg} mg`
      );

      const firstEntry = history.querySelector(".entry");
      if(firstEntry){
        history.insertBefore(nextEntry, firstEntry);
      } else {
        history.appendChild(nextEntry);
      }

      updateEmpty();
      nextEntry.scrollIntoView({behavior:"smooth", block:"start"});
    });

    grid.appendChild(box);
  });

  entry.appendChild(head);
  entry.appendChild(tabby);
  entry.appendChild(grid);
  return entry;
}

function updateEmpty(){
  const history = document.getElementById("history");
  const hasEntry = history.querySelector(".entry");
  let empty = document.getElementById("emptyState");

  if(hasEntry && empty){
    empty.remove();
  } else if(!hasEntry && !empty){
    empty = document.createElement("div");
    empty.id = "emptyState";
    empty.className = "empty";
    empty.textContent = "اختر تاريخًا";
    history.appendChild(empty);
  }
}

function addSelectedDate(){
  const dateInput = document.getElementById("purchaseDate");
  const penInput = document.getElementById("penCount");
  const pens = Math.max(1, parseInt(penInput.value || "3", 10));

  if(!dateInput.value) return;

  const history = document.getElementById("history");
  const entry = buildEntry(dateInput.value, pens);
  const firstEntry = history.querySelector(".entry");

  if(firstEntry){
    history.insertBefore(entry, firstEntry);
  } else {
    history.appendChild(entry);
  }

  updateEmpty();
  dateInput.value = "";
}

document.getElementById("purchaseDate").addEventListener("change", addSelectedDate);
</script>
</body>
</html>
