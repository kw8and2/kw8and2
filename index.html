<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مونجارو | شراء 3 أقلام</title>
<style>
  :root{
    --bg1:#0f172a;
    --bg2:#111827;
    --card:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --line:#e5e7eb;
    --primary:#7c3aed;
    --primary2:#06b6d4;
    --soft:#f8fafc;
    --chip:#eef2ff;
    --danger:#fee2e2;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Tahoma, Arial, sans-serif;
    background:#ffffff;
    color:var(--text);
    min-height:100vh;
  }
  .wrap{
    max-width:840px;
    margin:34px auto;
    padding:0 16px 34px;
  }
  .card{
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.25);
    border-radius:28px;
    padding:24px;
    box-shadow:0 18px 50px rgba(0,0,0,.22);
  }
  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  h1{
    margin:0;
    font-size:29px;
    line-height:1.2;
  }
  .badge{
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff;
    padding:10px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    box-shadow:0 8px 24px rgba(124,58,237,.22);
  }
  .input-card{
    background:linear-gradient(180deg,#ffffff,#f8fafc);
    border:1px solid var(--line);
    border-radius:22px;
    padding:18px;
  }
  .input-row{
    display:grid;
    grid-template-columns:1fr auto;
    gap:12px;
    align-items:end;
  }
  label{
    display:block;
    font-weight:800;
    margin-bottom:8px;
    font-size:15px;
  }
  input[type=date]{
    width:100%;
    padding:15px 16px;
    border:1px solid #d1d5db;
    border-radius:16px;
    font-size:17px;
    background:#fff;
    outline:none;
  }
  input[type=date]:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(124,58,237,.12);
  }
  button{
    border:0;
    border-radius:16px;
    padding:15px 22px;
    min-height:54px;
    cursor:pointer;
    font-size:16px;
    font-weight:800;
    color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    box-shadow:0 10px 24px rgba(124,58,237,.22);
  }
  .mini{
    margin-top:12px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    background:var(--chip);
    color:#4338ca;
    border-radius:999px;
    padding:8px 12px;
    font-size:13px;
    font-weight:700;
  }
  #history{
    margin-top:18px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .entry{
    background:#fff;
    border:1px solid var(--line);
    border-radius:24px;
    padding:18px;
    box-shadow:0 10px 26px rgba(15,23,42,.06);
  }
  .entry-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .entry-title{
    font-size:20px;
    font-weight:900;
  }
  .delete{
    background:var(--danger);
    color:#991b1b;
    padding:10px 14px;
    min-height:auto;
    box-shadow:none;
    font-size:13px;
    font-weight:800;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
  }
  .result{
    border:1px solid var(--line);
    background:var(--soft);
    border-radius:20px;
    padding:16px;
    text-align:center;
  }
  .dose{
    display:inline-block;
    padding:7px 12px;
    border-radius:999px;
    background:linear-gradient(135deg,#ede9fe,#cffafe);
    color:#312e81;
    font-size:15px;
    font-weight:900;
    margin-bottom:10px;
  }
  .weeks{
    color:var(--muted);
    font-size:14px;
    margin-bottom:10px;
    font-weight:700;
  }
  .date{
    font-size:17px;
    font-weight:900;
    margin-bottom:8px;
  }
  .month{
    font-size:14px;
    color:#374151;
    line-height:1.6;
    font-weight:700;
  }
  .empty{
    color:#cbd5e1;
    text-align:center;
    padding:26px 10px 8px;
    font-weight:700;
  }
  @media(max-width:700px){
    .input-row{grid-template-columns:1fr}
    .grid{grid-template-columns:1fr}
    button{width:100%}
    h1{font-size:24px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top">
      <h1>شراء 3 أقلام مونجارو</h1>
      <div class="badge">15 mg pen</div>
    </div>

    <div class="input-card">
      <div class="input-row">
        <div>
          <label for="purchaseDate">تاريخ الشراء</label>
          <input id="purchaseDate" type="date">
        </div>
        <button id="addBtn">إضافة</button>
      </div>

      <div class="mini">
        <div class="chip">50 = 12.5 mg</div>
        <div class="chip">45 = 11.25 mg</div>
        <div class="chip">40 = 10 mg</div>
        <div class="chip">3 × 2.7 ml = 810 units</div>
      </div>
    </div>

    <div id="history">
      <div class="empty" id="emptyState">أضف تاريخًا للبدء</div>
    </div>
  </div>
</div>

<script>
const arabicMonths = [
  "يناير","فبراير","مارس","أبريل","مايو","يونيو",
  "يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"
];

const configs = [
  {units:50, mg:12.5, weeks:16.2},
  {units:45, mg:11.25, weeks:18},
  {units:40, mg:10, weeks:20.25}
];

function parseLocalDate(value){
  const [y,m,d] = value.split("-").map(Number);
  return new Date(y, m-1, d, 12, 0, 0);
}

function addDays(date, days){
  const out = new Date(date);
  out.setDate(out.getDate() + days);
  return out;
}

function fmt(date){
  return `${date.getDate()}/${date.getMonth()+1}/${date.getFullYear()}`;
}

function nextMonthLabel(date){
  let m = date.getMonth()+1;
  let y = date.getFullYear();
  if(m === 12){
    m = 0;
    y += 1;
  }
  return `${arabicMonths[m]} ${y}`;
}

function buildEntry(value){
  const start = parseLocalDate(value);
  const entry = document.createElement("div");
  entry.className = "entry";

  const head = document.createElement("div");
  head.className = "entry-head";

  const title = document.createElement("div");
  title.className = "entry-title";
  title.textContent = `الشراء: ${fmt(start)}`;

  const del = document.createElement("button");
  del.className = "delete";
  del.textContent = "حذف";
  del.addEventListener("click", () => {
    entry.remove();
    updateEmpty();
  });

  head.appendChild(title);
  head.appendChild(del);

  const grid = document.createElement("div");
  grid.className = "grid";

  configs.forEach(c => {
    const end = addDays(start, Math.round(c.weeks * 7));

    const box = document.createElement("div");
    box.className = "result";
    box.innerHTML = `
      <div class="dose">${c.units} يونيت = ${c.mg} mg</div>
      <div class="weeks">${c.weeks} أسبوع</div>
      <div class="date">${fmt(end)}</div>
      <div class="month">الشهر التالي للشراء: <b>${nextMonthLabel(end)}</b></div>
    `;
    grid.appendChild(box);
  });

  entry.appendChild(head);
  entry.appendChild(grid);
  return entry;
}

function updateEmpty(){
  const history = document.getElementById("history");
  const hasEntry = history.querySelector(".entry");
  let empty = document.getElementById("emptyState");

  if(hasEntry && empty){
    empty.remove();
  } else if(!hasEntry && !empty){
    empty = document.createElement("div");
    empty.id = "emptyState";
    empty.className = "empty";
    empty.textContent = "أضف تاريخًا للبدء";
    history.appendChild(empty);
  }
}

document.getElementById("addBtn").addEventListener("click", () => {
  const input = document.getElementById("purchaseDate");
  if(!input.value){
    input.focus();
    return;
  }

  const history = document.getElementById("history");
  const entry = buildEntry(input.value);
  const firstEntry = history.querySelector(".entry");

  if(firstEntry){
    history.insertBefore(entry, firstEntry);
  } else {
    history.appendChild(entry);
  }

  updateEmpty();
  input.value = "";
  input.focus();
});
</script>
</body>
</html>
