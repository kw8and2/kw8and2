<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مونجارو | شراء الأقلام</title>
<style>
  :root{
    --bg:#ffffff;
    --card:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --line:#e5e7eb;
    --primary:#7c3aed;
    --primary2:#06b6d4;
    --soft:#f8fafc;
    --chip:#eef2ff;
    --good:#059669;
    --good-bg:#ecfdf5;
    --warn:#b45309;
    --warn-bg:#fffbeb;
    --danger:#991b1b;
    --danger-bg:#fee2e2;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  .wrap{
    max-width:820px;
    margin:24px auto;
    padding:0 14px 24px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px;
    box-shadow:0 14px 34px rgba(15,23,42,.08);
  }
  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:9px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  h1{margin:0;font-size:24px}
  .badge{
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff;
    padding:9px 13px;
    border-radius:999px;
    font-size:13px;
    font-weight:800;
  }
  .input-card{
    background:var(--soft);
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px;
  }
  .input-grid{
    display:grid;
    grid-template-columns:1.5fr .7fr;
    gap:9px;
    align-items:end;
  }
  label{
    display:block;
    font-weight:800;
    margin-bottom:6px;
    font-size:13px;
  }
  input{
    width:100%;
    padding:12px 14px;
    border:1px solid #d1d5db;
    border-radius:15px;
    font-size:15px;
    background:#fff;
    outline:none;
  }
  input:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(124,58,237,.10);
  }
  button{
    border:0;
    border-radius:15px;
    padding:12px 18px;
    min-height:46px;
    cursor:pointer;
    font-size:16px;
    font-weight:800;
    color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
  }
  .add-row{
    margin-top:10px;
    display:flex;
    gap:8px;
  }
  .add-row button{
    width:100%;
  }
  .same-day-alert{
    margin:0 0 12px;
    border:1px solid #f59e0b;
    background:#fffbeb;
    color:#92400e;
    border-radius:13px;
    padding:10px 12px;
    font-size:12px;
    font-weight:900;
    line-height:1.7;
  }
  .salary-mini-alert{
    display:inline-block;
    margin-top:6px;
    padding:3px 7px;
    border:1px solid #fecaca;
    background:#fef2f2;
    color:#991b1b;
    border-radius:999px;
    font-size:10px;
    font-weight:900;
    line-height:1.2;
    white-space:nowrap;
  }
  .mini{
    margin-top:9px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    background:var(--chip);
    color:#4338ca;
    border-radius:999px;
    padding:6px 10px;
    font-size:11px;
    font-weight:800;
  }
  #history{
    margin-top:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .entry{
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px;
    box-shadow:0 8px 24px rgba(15,23,42,.05);
  }
  .entry-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .entry-title{font-size:17px;font-weight:900}
  .entry-sub{font-size:13px;color:var(--muted);margin-top:4px;font-weight:700}
  .picked-note{
    display:inline-block;
    margin-top:6px;
    padding:5px 9px;
    border-radius:999px;
    background:#ecfeff;
    color:#0f766e;
    font-size:11px;
    font-weight:900;
  }
  .delete{
    background:var(--danger-bg);
    color:var(--danger);
    padding:9px 13px;
    min-height:auto;
    font-size:13px;
  }
  .tabby{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    margin-bottom:12px;
  }
  .tabby-box{
    border:1px solid var(--line);
    border-radius:13px;
    padding:10px 12px;
    background:#fafafa;
  }
  .tabby-title{
    font-size:11px;
    color:var(--muted);
    font-weight:800;
    margin-bottom:5px;
  }

  .pay-row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:5px;
  }
  .pay-chip{
    background:#fff;
    border:1px solid var(--line);
    border-radius:999px;
    padding:5px 8px;
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
  }
  .pay-chip.last{
    background:#ecfdf5;
    border-color:#10b981;
    color:#047857;
    box-shadow:0 0 0 2px rgba(16,185,129,.08);
  }
  .tabby-value{
    font-size:15px;
    font-weight:900;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
  }
  .result{
    border:1px solid var(--line);
    background:var(--soft);
    border-radius:16px;
    padding:12px;
    text-align:center;
  }
  .dose{
    display:inline-block;
    padding:6px 10px;
    border-radius:999px;
    background:linear-gradient(135deg,#ede9fe,#cffafe);
    color:#312e81;
    font-size:13px;
    font-weight:900;
    margin-bottom:6px;
  }
  .weeks{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:8px;
    font-size:13px;
    font-weight:900;
  }
  .full-dose-count{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:7px 11px;
    border-radius:11px;
    background:linear-gradient(135deg,#e0f2fe,#dbeafe);
    border:2px solid #38bdf8;
    color:#075985;
    box-shadow:0 3px 10px rgba(14,165,233,.16);
    font-weight:950;
  }
  .remaining-units{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:7px 11px;
    border-radius:11px;
    background:linear-gradient(135deg,#fff7ed,#ffedd5);
    border:2px solid #fb923c;
    color:#c2410c;
    box-shadow:0 3px 10px rgba(249,115,22,.16);
    font-weight:950;
  }
  .date{
    font-size:15px;
    font-weight:900;
    margin-bottom:6px;
  }
  .date.clickable{
    cursor:pointer;
    display:inline-block;
    padding:6px 10px;
    border-radius:10px;
    background:#ffffff;
    border:1px solid #d8b4fe;
    color:#6d28d9;
    user-select:none;
    transition:.15s ease;
  }
  .date.clickable:hover{
    background:#faf5ff;
    border-color:#a78bfa;
  }
  .date.clickable:active{
    transform:scale(.98);
  }
  .month{
    font-size:13px;
    color:#374151;
    line-height:1.55;
    font-weight:700;
  }
  .status{
    margin-top:7px;
    border-radius:12px;
    padding:7px 8px;
    font-size:11px;
    font-weight:900;
  }
  .status.good{background:var(--good-bg);color:var(--good)}
  .status.warn{background:var(--warn-bg);color:var(--warn)}
  .field-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:6px;
  }
  .field-head > label[for="penCount"]{
    margin:0;
  }
  .tabby-toggle{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:900;
    color:#111827;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  .tabby-toggle input{
    width:18px;
    height:18px;
    margin:0;
    cursor:pointer;
    accent-color:#10b981;
  }
  .option-toggles{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }
  .auto-toggle input{accent-color:#7c3aed}
  .clear-all-btn{
    border:1px solid #fecaca;
    background:#fef2f2;
    color:#991b1b;
    border-radius:10px;
    padding:6px 10px;
    min-height:30px;
    font-size:11px;
    font-weight:900;
    cursor:pointer;
    white-space:nowrap;
  }
  .clear-all-btn:active{transform:translateY(1px)}
  .head-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  body.tabby-off .tabby-only{
    display:none !important;
  }



  /* حاسبة السائل المتبقي */
  .liquid-card{
    margin-top:12px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:16px;
    padding:12px;
  }
  .liquid-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .liquid-title{font-size:16px;font-weight:900;margin:0}
  .liquid-hint{font-size:11px;color:var(--muted);margin-top:3px;font-weight:700}
  .liquid-settings{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:8px;
  }
  .liquid-field{
    border:1px solid var(--line);
    border-radius:13px;
    padding:8px 10px;
    background:var(--soft);
  }
  .liquid-field label{
    font-size:10px;
    color:var(--muted);
    margin-bottom:4px;
  }
  .liquid-field input{
    border:0;
    background:transparent;
    box-shadow:none;
    padding:3px 0;
    border-radius:0;
    font-weight:900;
  }
  .liquid-field input:focus{box-shadow:none;border-color:transparent}
  .liquid-static{font-size:15px;font-weight:900;line-height:28px}
  .liquid-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:8px;
  }
  .liquid-actions button{
    min-height:34px;
    width:auto;
    padding:7px 10px;
    border-radius:10px;
    font-size:12px;
    background:#f8fafc;
    color:#334155;
    border:1px solid var(--line);
  }
  .liquid-actions .primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:0}
  .liquid-actions .danger{background:#fef2f2;color:#991b1b;border-color:#fecaca}
  .liquid-actions .copy{background:#eff6ff;color:#075985;border-color:#bae6fd;margin-inline-start:auto}
  .liquid-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:13px}
  .liquid-table{width:100%;border-collapse:collapse;min-width:620px}
  .liquid-table th,.liquid-table td{
    padding:7px 6px;
    text-align:center;
    border-bottom:1px solid var(--line);
    font-size:11px;
    white-space:nowrap;
  }
  .liquid-table th{background:#f8fafc;color:var(--muted);font-size:10px;font-weight:900}
  .liquid-table tr:last-child td{border-bottom:0}
  .liquid-week{font-weight:900}
  .liquid-dose-select{
    border:1px solid #d1d5db;
    border-radius:9px;
    background:#fff;
    padding:5px 7px;
    font-size:11px;
    font-weight:900;
    min-width:100px;
    color:var(--text);
  }
  .liquid-units{font-weight:900;color:#4338ca}
  .liquid-ml,.liquid-remain{font-weight:900}
  .liquid-status{
    display:inline-block;
    padding:3px 7px;
    border-radius:999px;
    font-size:9px;
    font-weight:900;
  }
  .liquid-status.ok{background:var(--good-bg);color:var(--good)}
  .liquid-status.warn{background:var(--warn-bg);color:var(--warn)}
  .liquid-status.bad{background:var(--danger-bg);color:var(--danger)}
  .liquid-del{
    min-height:auto!important;
    width:auto!important;
    padding:2px 7px!important;
    border:0!important;
    background:transparent!important;
    color:#9ca3af!important;
    font-size:17px!important;
  }
  .liquid-empty{text-align:center;color:#9ca3af;font-weight:800;padding:14px!important}
  .liquid-footer{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:8px;
    color:var(--muted);
    font-size:11px;
    font-weight:700;
  }
  .liquid-footer b{color:var(--text)}
  .liquid-toast{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translate(-50%,10px);
    opacity:0;
    pointer-events:none;
    background:#111827;
    color:#fff;
    padding:8px 12px;
    border-radius:999px;
    font-size:11px;
    font-weight:900;
    transition:.2s;
    z-index:99;
  }
  .liquid-toast.show{opacity:1;transform:translate(-50%,0)}

  .empty{
    color:#9ca3af;
    text-align:center;
    padding:24px 10px 6px;
    font-weight:700;
  }
  @media(max-width:720px){
    .input-grid{grid-template-columns:1fr}
    .grid{grid-template-columns:1fr}
    .tabby{grid-template-columns:1fr}
    button{width:100%}
    h1{font-size:24px}
    .liquid-settings{grid-template-columns:1fr}
    .liquid-actions button{width:100%}
    .liquid-actions .copy{margin-inline-start:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top">
      <h1>مونجارو</h1>
      <div class="head-actions">
        <div class="badge">15 mg</div>
        <button class="clear-all-btn" id="clearDateBtn" type="button">مسح الكل</button>
      </div>
    </div>

    <div class="input-card">
      <div class="input-grid">
        <div>
          <label for="purchaseDate">تاريخ الشراء</label>
          <input id="purchaseDate" type="date">
        </div>
        <div>
          <div class="field-head">
            <label for="penCount">عدد الأقلام</label>
            <div class="option-toggles">
              <label class="tabby-toggle" for="tabbyToggle">
                <input id="tabbyToggle" type="checkbox" checked>
                <span>تابي</span>
              </label>
              <label class="tabby-toggle auto-toggle" for="autoResultToggle">
                <input id="autoResultToggle" type="checkbox" checked>
                <span>تفعيل النتيجة تلقائي</span>
              </label>
            </div>
          </div>
          <input id="penCount" type="number" min="1" max="20" step="1" value="3">
        </div>
      </div>

      <div class="add-row">
        <button id="addDateBtn" type="button">إضافة النتيجة</button>
      </div>

      <div class="mini">
        <div class="chip">50 = 12.5 mg</div>
        <div class="chip">45 = 11.25 mg</div>
        <div class="chip">40 = 10 mg</div>
        <div class="chip tabby-only">تابي: 4 دفعات</div>
        <div class="chip">الراتب: يوم 22 من كل شهر</div>
      </div>
    </div>



    <div id="history">
      <div class="empty" id="emptyState">اختر تاريخًا</div>
    </div>

    <div class="liquid-card" id="weeksSection">
      <div class="liquid-head">
        <div>
          <div class="liquid-title">حساب السائل المتبقي</div>
          <div class="liquid-hint">ابدأ بدون أسابيع، ثم أضف الجرعات عند الحاجة</div>
        </div>
        <div class="head-actions">
          <div class="badge">15 mg</div>
          <button class="clear-all-btn" id="clearLiquidBtn" type="button">مسح الكل</button>
        </div>
      </div>

      <div class="liquid-settings">
        <div class="liquid-field">
          <label for="startVolume">كمية القلم عند البداية (ml)</label>
          <input id="startVolume" type="number" inputmode="decimal" min="0.01" step="0.01" value="2.70">
        </div>
        <div class="liquid-field">
          <label>تركيز القلم الأساسي</label>
          <div class="liquid-static">15 mg / 0.60 ml</div>
        </div>
      </div>

      <div class="liquid-actions">
        <button class="primary" id="addWeek" type="button">+ إضافة أسبوع</button>
        <button id="removeLast" type="button">حذف آخر أسبوع</button>
        <button class="copy" id="copyPlan" type="button">نسخ الخطة</button>
      </div>

      <div class="liquid-table-wrap">
        <table class="liquid-table">
          <thead>
            <tr><th>الأسبوع</th><th>الجرعة</th><th>اليونيت</th><th>المستخدم</th><th>المتبقي</th><th>الحالة</th><th></th></tr>
          </thead>
          <tbody id="weeksBody"></tbody>
        </table>
      </div>
      <div class="liquid-footer">
        <span>البداية: <b id="startSummary">2.70 ml</b></span>
        <span>المستخدم: <b id="usedSummary">0.00 ml</b></span>
        <span>المتبقي: <b id="remainSummary">2.70 ml</b></span>
      </div>
    </div>

  </div>
</div>
<div class="liquid-toast" id="liquidToast">تم النسخ</div>

<script>


/* ===== حساب السائل المتبقي ===== */
const liquidDoses = [15,13.75,12.5,11.25,10,8.75,7.5,6.25,5,3.75,2.5,1.25];
const LIQUID_MG_PER_UNIT = 0.25;
const LIQUID_ML_PER_UNIT = 0.01;
let liquidWeeks = [];

function liquidNumber(value, digits = 2){
  return Number(value).toFixed(digits);
}
function liquidUnitsForDose(dose){
  return Math.round(dose / LIQUID_MG_PER_UNIT);
}
function renderLiquidWeeks(){
  const startInput = document.getElementById('startVolume');
  const body = document.getElementById('weeksBody');
  let startMl = parseFloat(startInput.value);
  if(!Number.isFinite(startMl) || startMl <= 0) startMl = 2.70;

  const startUnits = Math.round(startMl / LIQUID_ML_PER_UNIT);
  let usedUnits = 0;
  let html = '';

  if(!liquidWeeks.length){
    html = '<tr><td colspan="7" class="liquid-empty">لا توجد أسابيع — اضغط + إضافة أسبوع</td></tr>';
  }

  liquidWeeks.forEach((week, index) => {
    const units = liquidUnitsForDose(week.dose);
    usedUnits += units;
    const remainingUnits = startUnits - usedUnits;
    const remainingMl = remainingUnits * LIQUID_ML_PER_UNIT;
    let cls = 'ok';
    let label = 'متوفر';
    if(remainingUnits < 0){
      cls = 'bad';
      label = 'غير كافٍ';
    } else if(remainingUnits < units){
      cls = 'warn';
      label = 'قريب من النفاد';
    }

    html += `
      <tr>
        <td class="liquid-week">${index + 1}</td>
        <td>
          <select class="liquid-dose-select" data-liquid-index="${index}">
            ${liquidDoses.map(d => `<option value="${d}" ${d === week.dose ? 'selected' : ''}>${d} mg</option>`).join('')}
          </select>
        </td>
        <td class="liquid-units">${units} U</td>
        <td class="liquid-ml">${liquidNumber(units * LIQUID_ML_PER_UNIT)} ml</td>
        <td class="liquid-remain">${remainingUnits >= 0 ? liquidNumber(remainingMl) + ' ml' : '-' + liquidNumber(Math.abs(remainingMl)) + ' ml'}</td>
        <td><span class="liquid-status ${cls}">${label}</span></td>
        <td><button class="liquid-del" type="button" data-liquid-del="${index}" title="حذف">×</button></td>
      </tr>`;
  });

  body.innerHTML = html;
  const usedMl = usedUnits * LIQUID_ML_PER_UNIT;
  const remainMl = startMl - usedMl;
  document.getElementById('startSummary').textContent = liquidNumber(startMl) + ' ml';
  document.getElementById('usedSummary').textContent = liquidNumber(usedMl) + ' ml';
  document.getElementById('remainSummary').textContent = liquidNumber(Math.max(0, remainMl)) + ' ml';

  document.querySelectorAll('.liquid-dose-select').forEach(select => {
    select.addEventListener('change', event => {
      liquidWeeks[Number(event.target.dataset.liquidIndex)].dose = Number(event.target.value);
      renderLiquidWeeks();
    });
  });
  document.querySelectorAll('[data-liquid-del]').forEach(button => {
    button.addEventListener('click', event => {
      liquidWeeks.splice(Number(event.currentTarget.dataset.liquidDel), 1);
      renderLiquidWeeks();
    });
  });
}

function showLiquidToast(message){
  const toast = document.getElementById('liquidToast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1400);
}

document.getElementById('addWeek').addEventListener('click', () => {
  liquidWeeks.push({dose:10});
  renderLiquidWeeks();
});
document.getElementById('removeLast').addEventListener('click', () => {
  if(liquidWeeks.length) liquidWeeks.pop();
  renderLiquidWeeks();
});
document.getElementById('clearDateBtn').addEventListener('click', () => {
  // مسح نتائج أداة حساب التاريخ فقط مع إبقاء التاريخ وعدد الأقلام والإعدادات كما هي.
  const history = document.getElementById('history');
  history.querySelectorAll('.entry').forEach(entry => entry.remove());
  updateEmpty();
});

document.getElementById('clearLiquidBtn').addEventListener('click', () => {
  // مسح أداة حساب السائل فقط.
  document.getElementById('startVolume').value = '2.70';
  liquidWeeks = [];
  renderLiquidWeeks();
});
document.getElementById('startVolume').addEventListener('input', renderLiquidWeeks);
document.getElementById('copyPlan').addEventListener('click', async () => {
  const startMl = parseFloat(document.getElementById('startVolume').value) || 2.70;
  let usedUnits = 0;
  const lines = [`كمية البداية: ${liquidNumber(startMl)} ml`];
  liquidWeeks.forEach((week, index) => {
    const units = liquidUnitsForDose(week.dose);
    usedUnits += units;
    const remain = startMl - (usedUnits * LIQUID_ML_PER_UNIT);
    lines.push(`الأسبوع ${index + 1}: ${week.dose} mg = ${units} U = ${liquidNumber(units * LIQUID_ML_PER_UNIT)} ml | المتبقي ${liquidNumber(remain)} ml`);
  });
  try{
    await navigator.clipboard.writeText(lines.join('\n'));
    showLiquidToast('تم نسخ الخطة');
  }catch{
    showLiquidToast('تعذر النسخ');
  }
});
renderLiquidWeeks();

const arabicMonths = [
  "يناير","فبراير","مارس","أبريل","مايو","يونيو",
  "يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"
];

const configs = [
  {units:50, mg:12.5},
  {units:45, mg:11.25},
  {units:40, mg:10}
];

// تاريخ الراتب الثابت في هذه الصفحة: يوم 22 من كل شهر.
const SALARY_DAY = 22;

function parseLocalDate(value){
  const [y,m,d] = value.split("-").map(Number);
  return new Date(y, m-1, d, 12, 0, 0);
}

function addDays(date, days){
  const out = new Date(date);
  out.setDate(out.getDate() + days);
  return out;
}

function addMonthsSafe(date, months){
  const out = new Date(date);
  const originalDay = out.getDate();
  out.setDate(1);
  out.setMonth(out.getMonth() + months);
  const lastDay = new Date(out.getFullYear(), out.getMonth()+1, 0).getDate();
  out.setDate(Math.min(originalDay, lastDay));
  return out;
}

function fmt(date){
  return `${date.getDate()}/${date.getMonth()+1}/${date.getFullYear()}`;
}

function inputDateValue(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function monthName(date){
  return `${arabicMonths[date.getMonth()]} ${date.getFullYear()}`;
}

function daysBetween(a,b){
  return Math.round((b-a)/(1000*60*60*24));
}

function sameYearMonth(a,b){
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth();
}

function salaryOn22(year, monthIndex){
  return new Date(year, monthIndex, SALARY_DAY, 12, 0, 0);
}

function previousMonthSalary(date){
  return salaryOn22(date.getFullYear(), date.getMonth() - 1);
}

function nextMonthSalaryAfter(date){
  return salaryOn22(date.getFullYear(), date.getMonth() + 1);
}

function buildEntry(value, pens, pickedLabel = '', sameDayMatches = []){
  const start = parseLocalDate(value);
  const totalUnits = pens * 270; // 2.7 ml = 270 units per pen

  // Tabby: 4 payments, first payment on purchase day, final payment 3 months later.
  const finalInstallment = addMonthsSafe(start, 3);

  const entry = document.createElement("div");
  entry.className = "entry";
  entry.dataset.purchaseDate = inputDateValue(start);
  entry.dataset.finalInstallment = inputDateValue(finalInstallment);

  const head = document.createElement("div");
  head.className = "entry-head";

  const headText = document.createElement("div");
  headText.innerHTML = `
    <div class="entry-title">${fmt(start)}</div>
    <div class="entry-sub">${pens} قلم · ${totalUnits} يونيت</div>
    ${pickedLabel ? `<div class="picked-note">مختار من نتيجة ${pickedLabel}</div>` : ``}
  `;

  const del = document.createElement("button");
  del.className = "delete";
  del.textContent = "حذف";
  del.addEventListener("click", () => {
    entry.remove();
    updateEmpty();
  });

  head.appendChild(headText);
  head.appendChild(del);

  const paymentDates = [
    start,
    addMonthsSafe(start, 1),
    addMonthsSafe(start, 2),
    addMonthsSafe(start, 3)
  ];

  // جميع أشهر دفعات تابي النشطة: دفعات هذا الشراء + دفعات المشتريات السابقة الظاهرة.
  // نستخدمها لتنبيه المستخدم إذا كان شراء القلم التالي سيقع في شهر توجد فيه دفعة تابي.
  const activeTabbyPaymentDates = [...paymentDates];
  const allTabbyFinalDates = [finalInstallment];
  document.querySelectorAll("#history .entry").forEach(existingEntry => {
    const purchase = existingEntry.dataset.purchaseDate;
    if(purchase){
      const purchaseDate = parseLocalDate(purchase);
      for(let i = 0; i < 4; i++){
        activeTabbyPaymentDates.push(addMonthsSafe(purchaseDate, i));
      }
    }

    const existingFinal = existingEntry.dataset.finalInstallment;
    if(existingFinal){
      allTabbyFinalDates.push(parseLocalDate(existingFinal));
    }
  });

  const sameDayAlert = document.createElement("div");
  sameDayAlert.className = "same-day-alert tabby-only";
  if(sameDayMatches.length){
    const origins = sameDayMatches.map(d => fmt(parseLocalDate(d))).join("، ");
    sameDayAlert.innerHTML = `⚠️ تنبيه: تاريخ شراء هذا القلم <strong>${fmt(start)}</strong> يوافق تاريخ دفعة تابي الأخيرة لشراء سابق بتاريخ ${origins}.`;
  } else {
    sameDayAlert.style.display = "none";
  }

  const tabby = document.createElement("div");
  tabby.className = "tabby tabby-only";
  tabby.innerHTML = `
    <div class="tabby-box">
      <div class="tabby-title">تابي · 4 دفعات</div>
      <div class="pay-row">
        <span class="pay-chip">${fmt(paymentDates[0])}</span>
        <span class="pay-chip">${fmt(paymentDates[1])}</span>
        <span class="pay-chip">${fmt(paymentDates[2])}</span>
        <span class="pay-chip last">الأخيرة ${fmt(paymentDates[3])}</span>
      </div>
    </div>
  `;

  const grid = document.createElement("div");
  grid.className = "grid";

  configs.forEach(c => {
    // نحسب فقط الجرعات الأسبوعية الكاملة التي يمكن سحبها من الأقلام.
    // تاريخ النتيجة هو موعد الجرعة التالية التي لن تكفي لها الكمية المتبقية.
    const exactDoses = totalUnits / c.units;
    const fullDoses = Math.floor(exactDoses);
    const remainingUnits = totalUnits - (fullDoses * c.units);
    const end = addDays(start, fullDoses * 7);
    const diff = daysBetween(finalInstallment, end);

    let statusText, statusClass;
    if(diff >= 0){
      statusText = `تابي ينتهي قبل الأقلام بـ ${diff} يوم`;
      statusClass = "good";
    } else {
      statusText = `الأقلام تنتهي قبل تابي بـ ${Math.abs(diff)} يوم`;
      statusClass = "warn";
    }

    // قاعدة الراتب:
    // إذا كان موعد الحاجة للقلم يوم 17 أو قبله، يكون الشراء المقترح من راتب 22 للشهر السابق.
    // إذا أغلقت كل دفعات تابي، ووصل/طاف راتب 22 للشهر التالي بعد آخر دفعة، لا نظهر أي تنبيه شراء.
    const latestTabbyFinal = allTabbyFinalDates.reduce((latest, d) => d > latest ? d : latest, allTabbyFinalDates[0]);
    const salaryAfterLastTabby = nextMonthSalaryAfter(latestTabbyFinal);
    const allTabbyClosed = allTabbyFinalDates.every(d => end > d);
    const tabbyFullyClearedAndNextSalaryPassed = allTabbyClosed && end >= salaryAfterLastTabby;

    let suggestedPurchaseDate = null;
    let salaryMiniAlert = ``;

    if(!tabbyFullyClearedAndNextSalaryPassed && end.getDate() <= 17){
      suggestedPurchaseDate = previousMonthSalary(end);
      salaryMiniAlert = `<div class="salary-mini-alert tabby-only">⚠️ اشترِ ${fmt(suggestedPurchaseDate)}</div>`;
    }

    // تنبيه تابي لهذه العملية فقط: يظهر فقط إذا كان شهر شراء القلم التالي
    // يحتوي فعلًا على إحدى دفعات تابي الأربع الخاصة بهذا الشراء.
    // مثال: شراء 22/8/2026 دفعاته تنتهي 22/11/2026، لذلك نتيجة 26/12/2026 لا تُظهر التنبيه.
    const monthToCheck = suggestedPurchaseDate || end;
    const hasTabbyPaymentSameMonth = !tabbyFullyClearedAndNextSalaryPassed &&
      paymentDates.some(d => sameYearMonth(d, monthToCheck));
    const tabbyMonthMiniAlert = hasTabbyPaymentSameMonth
      ? `<div class="salary-mini-alert tabby-only">⚠️ شهر فيه دفعة تابي</div>`
      : ``;

    const box = document.createElement("div");
    box.className = "result";
    box.innerHTML = `
      <div class="dose">${c.units} يونيت = ${c.mg} mg</div>
      <div class="weeks">
        <span class="full-dose-count">${fullDoses} جرعة كاملة</span>
        ${remainingUnits > 0 ? `<span class="remaining-units">متبقي ${remainingUnits} يونيت</span>` : ``}
      </div>
      <div class="date clickable" title="موعد الجرعة التالية التي تحتاج قلمًا جديدًا — اضغط لإضافة النتائج الجديدة تلقائيًا">${fmt(end)}</div>
      ${salaryMiniAlert}
      ${tabbyMonthMiniAlert}
      <div class="status ${statusClass} tabby-only">${statusText}</div>
    `;

    const resultDate = box.querySelector(".date.clickable");
    resultDate.addEventListener("click", () => {
      const dateInput = document.getElementById("purchaseDate");
      const penInput = document.getElementById("penCount");
      const nextPens = Math.max(1, parseInt(penInput.value || String(pens), 10));
      const selectedDate = inputDateValue(end);
      const history = document.getElementById("history");

      // نبقي التاريخ ظاهرًا في الخانة، لكن الضغط على النتيجة يضيف النتائج الجديدة فورًا.
      dateInput.value = selectedDate;

      const autoMode = document.getElementById("autoResultToggle").checked;
      const sameDayMatches = autoMode ? [] : Array.from(history.querySelectorAll(".entry"))
        .filter(e => e.dataset.finalInstallment === selectedDate)
        .map(e => e.dataset.purchaseDate)
        .filter(Boolean);

      if(autoMode){
        renderAutoResult(`${c.units} يونيت = ${c.mg} mg`);
      } else {
        const nextEntry = buildEntry(
          selectedDate,
          nextPens,
          `${c.units} يونيت = ${c.mg} mg`,
          sameDayMatches
        );

        const firstEntry = history.querySelector(".entry");
        if(firstEntry){
          history.insertBefore(nextEntry, firstEntry);
        } else {
          history.appendChild(nextEntry);
        }

        updateEmpty();
        nextEntry.scrollIntoView({behavior:"smooth", block:"start"});
      }
    });

    grid.appendChild(box);
  });

  entry.appendChild(head);
  entry.appendChild(sameDayAlert);
  entry.appendChild(tabby);
  entry.appendChild(grid);
  return entry;
}

function updateEmpty(){
  const history = document.getElementById("history");
  const hasEntry = history.querySelector(".entry");
  let empty = document.getElementById("emptyState");

  if(hasEntry && empty){
    empty.remove();
  } else if(!hasEntry && !empty){
    empty = document.createElement("div");
    empty.id = "emptyState";
    empty.className = "empty";
    empty.textContent = "اختر تاريخًا";
    history.appendChild(empty);
  }
}

function renderAutoResult(pickedLabel = ''){
  const autoToggle = document.getElementById("autoResultToggle");
  if(!autoToggle || !autoToggle.checked) return;

  const dateInput = document.getElementById("purchaseDate");
  const penInput = document.getElementById("penCount");
  const history = document.getElementById("history");

  // في الوضع التلقائي تكون هناك نتيجة واحدة فقط، وتتغير مباشرة حسب التاريخ وعدد الأقلام.
  history.querySelectorAll(".entry").forEach(entry => entry.remove());

  if(!dateInput.value){
    updateEmpty();
    return;
  }

  const pens = Math.max(1, parseInt(penInput.value || "3", 10));
  const entry = buildEntry(dateInput.value, pens, pickedLabel, []);
  entry.classList.add("auto-single-entry");

  const deleteButton = entry.querySelector(".delete");
  if(deleteButton) deleteButton.style.display = "none";

  const empty = document.getElementById("emptyState");
  if(empty) empty.remove();
  history.appendChild(entry);
  updateEmpty();
}

function addSelectedDate(){
  const dateInput = document.getElementById("purchaseDate");
  const penInput = document.getElementById("penCount");
  const pens = Math.max(1, parseInt(penInput.value || "3", 10));

  if(!dateInput.value) return;
  if(document.getElementById("autoResultToggle").checked){
    renderAutoResult();
    return;
  }

  const history = document.getElementById("history");
  const selectedDate = dateInput.value;
  const pickedLabel = dateInput.dataset.pickedLabel || "";

  // تنبيه إذا وافق تاريخ الشراء تاريخ الدفعة الرابعة/الأخيرة لتابي لشراء سابق.
  const sameDayMatches = Array.from(history.querySelectorAll(".entry"))
    .filter(e => e.dataset.finalInstallment === selectedDate)
    .map(e => e.dataset.purchaseDate)
    .filter(Boolean);

  const entry = buildEntry(selectedDate, pens, pickedLabel, sameDayMatches);
  const firstEntry = history.querySelector(".entry");

  if(firstEntry){
    history.insertBefore(entry, firstEntry);
  } else {
    history.appendChild(entry);
  }

  updateEmpty();
  // إبقاء تاريخ الشراء ظاهرًا وثابتًا بعد إضافة النتيجة، خصوصًا على iPhone.
  // نمسح فقط وصف الاختيار الداخلي حتى لا ينتقل إلى نتيجة لاحقة بالخطأ.
  delete dateInput.dataset.pickedLabel;
}

// تفعيل/إخفاء كل ما يخص تابي من الصفحة.
// الخيار مفعّل افتراضيًا، وإزالة الصح تخفي دفعات تابي والتنبيهات والحالة الخاصة به فورًا.
const tabbyToggle = document.getElementById("tabbyToggle");
function applyTabbyVisibility(){
  document.body.classList.toggle("tabby-off", !tabbyToggle.checked);
}
tabbyToggle.addEventListener("change", applyTabbyVisibility);
applyTabbyVisibility();

// خيار النتيجة التلقائية مفعّل افتراضيًا.
// نحافظ على نتيجة واحدة فقط، وتتحدث مباشرة مع تغيير التاريخ أو عدد الأقلام.
const autoResultToggle = document.getElementById("autoResultToggle");
autoResultToggle.addEventListener("change", () => {
  if(autoResultToggle.checked){
    renderAutoResult();
  }
});

// الإدخال اليدوي يبقى عبر الزر عندما يكون الخيار التلقائي غير مفعّل.
document.getElementById("addDateBtn").addEventListener("click", addSelectedDate);
document.getElementById("purchaseDate").addEventListener("change", () => {
  delete document.getElementById("purchaseDate").dataset.pickedLabel;
  renderAutoResult();
});
document.getElementById("penCount").addEventListener("input", () => {
  renderAutoResult();
});
</script>
